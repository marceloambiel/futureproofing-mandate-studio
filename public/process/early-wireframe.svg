<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f5f5f5"/><style>text{font-family:Arial,sans-serif;fill:#333} .h{font-size:22px;font-weight:bold}.b{font-size:15px}</style><text x="32" y="40" class="h">Early structural wireframe — captured before feature implementation</text><text x="32" y="70" class="b">Homepage → Assignment → Candidates → Discussion → Ready for review</text><rect x="30" y="105" width="375" height="430" rx="3" fill="white" stroke="#aaa"/><rect x="30" y="105" width="65" height="430" fill="#eee"/><text x="110" y="145" class="h">Assignment</text><rect x="110" y="170" width="275" height="56" fill="#f5f5f5" stroke="#ccc"/><text x="120" y="200" class="b">Current: integrate 2 acquisitions</text><rect x="110" y="240" width="275" height="56" fill="#f5f5f5" stroke="#ccc"/><text x="120" y="270" class="b">Earlier approved: expansion</text><rect x="110" y="310" width="275" height="56" fill="#f5f5f5" stroke="#ccc"/><text x="120" y="340" class="b">12 locations / start within 60 days</text><rect x="110" y="480" width="180" height="34" fill="#ddd"/><text x="120" y="502" class="b">Next task action</text><rect x="425" y="105" width="375" height="430" rx="3" fill="white" stroke="#aaa"/><rect x="425" y="105" width="65" height="430" fill="#eee"/><text x="505" y="145" class="h">Compare candidates</text><rect x="505" y="170" width="275" height="56" fill="#f5f5f5" stroke="#ccc"/><text x="515" y="200" class="b">Integration / scale / availability</text><rect x="505" y="240" width="275" height="56" fill="#f5f5f5" stroke="#ccc"/><text x="515" y="270" class="b">A: unknown / 4 to 12 / 30 days</text><rect x="505" y="310" width="275" height="56" fill="#f5f5f5" stroke="#ccc"/><text x="515" y="340" class="b">B: 2 integrations / clarify scale / 45 days</text><rect x="505" y="380" width="275" height="56" fill="#f5f5f5" stroke="#ccc"/><text x="515" y="410" class="b">C: unverified / not supplied / 90 days</text><rect x="505" y="480" width="180" height="34" fill="#ddd"/><text x="515" y="502" class="b">Next task action</text><rect x="820" y="105" width="375" height="430" rx="3" fill="white" stroke="#aaa"/><rect x="820" y="105" width="65" height="430" fill="#eee"/><text x="900" y="145" class="h">Discussion brief</text><rect x="900" y="170" width="275" height="56" fill="#f5f5f5" stroke="#ccc"/><text x="910" y="200" class="b">Revised mandate first</text><rect x="900" y="240" width="275" height="56" fill="#f5f5f5" stroke="#ccc"/><text x="910" y="270" class="b">Evidence and trade-offs</text><rect x="900" y="310" width="275" height="56" fill="#f5f5f5" stroke="#ccc"/><text x="910" y="340" class="b">Questions to investigate</text><rect x="900" y="380" width="275" height="56" fill="#f5f5f5" stroke="#ccc"/><text x="910" y="410" class="b">Draft -> Ready for review</text><rect x="900" y="480" width="180" height="34" fill="#ddd"/><text x="910" y="502" class="b">Next task action</text><text x="32" y="585" class="b">Mobile: shared criteria stack; each group repeats A / B / C. Evidence opens in a sheet.</text><text x="32" y="615" class="b">Business mandate stays separate from document status. Restoring creates a new draft requiring review.</text></svg>